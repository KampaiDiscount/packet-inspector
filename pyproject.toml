[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-audit"
version = "0.1.4"
description = "Loss-visible, stream-aware sensitive-information traffic auditor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Packet Audit contributors" }]
dependencies = ["pcapy-ng==1.1.0"]
keywords = ["packet-inspection", "network-audit", "pcap", "kali-linux"]

[project.urls]
Homepage = "https://github.com/KampaiDiscount/packet-inspector"
Documentation = "https://github.com/KampaiDiscount/packet-inspector#readme"
Repository = "https://github.com/KampaiDiscount/packet-inspector"
Issues = "https://github.com/KampaiDiscount/packet-inspector/issues"
Releases = "https://github.com/KampaiDiscount/packet-inspector/releases"
Changelog = "https://github.com/KampaiDiscount/packet-inspector/blob/main/RELEASE.md"

[project.scripts]
packet-audit = "packet_audit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packet_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
